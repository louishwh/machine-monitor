[package]
name = "fleetwatch-agent"
version = "0.1.2"
edition = "2021"
description = "FleetWatch monitoring agent — reverse-connects to the central server"
license.workspace = true
repository.workspace = true

# cargo-deb packaging (run `./scripts/build-deb.sh` on a Debian/Ubuntu host).
# The systemd unit ships as a plain asset and enabling is handled in the
# maintainer scripts — do NOT use [package.metadata.deb.systemd-units]: its
# generated fragments need debhelper's dh_* tools, which are not present on
# every build host (e.g. macOS cross-packaging).
[package.metadata.deb]
maintainer = "louis <louishwh@users.noreply.github.com>"
copyright = "2026, louis"
section = "admin"
priority = "optional"
depends = "$auto"
extended-description = "Lightweight agent that connects out to the FleetWatch central server over wss, reports machine status, and runs operator-authorized commands."
assets = [
    ["target/release/fleetwatch-agent", "usr/bin/", "755"],
    ["../../packaging/deb/agent.toml.example", "etc/fleetwatch/agent.toml", "600"],
    ["../../packaging/deb/fleetwatch-agent.service", "lib/systemd/system/", "644"],
]
conf-files = ["/etc/fleetwatch/agent.toml"]
maintainer-scripts = "../../packaging/deb/scripts"

[dependencies]
fw-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-util"] }
anyhow = { workspace = true }
chrono = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3"
toml = "0.8"
url = "2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
rpassword = "7.5"
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.32"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"

[dev-dependencies]
rcgen = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
