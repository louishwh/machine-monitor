[package]
name = "fleetwatch-server"
version = "0.1.0"
edition = "2021"
description = "FleetWatch central server — agent WebSocket hub + signed control plane"
license.workspace = true
repository.workspace = true

[lib]
name = "fleetwatch_server"
path = "src/lib.rs"

[[bin]]
name = "fleetwatch-server"
path = "src/main.rs"

# cargo-deb packaging (same layout as fleetwatch-agent; built by
# scripts/build-deb.sh / the release workflow). The systemd unit ships as a
# plain asset and enabling is handled in the maintainer scripts — do NOT use
# [package.metadata.deb.systemd-units]: its generated fragments need
# debhelper's dh_* tools, not present on every build host.
[package.metadata.deb]
maintainer = "louis <louishwh@users.noreply.github.com>"
copyright = "2026, louis"
section = "admin"
priority = "optional"
depends = "$auto"
extended-description = "Central server for FleetWatch: terminates agent WebSocket connections over TLS, stores machine registry and status snapshots in SQLite, and exposes the signed control plane used by the console, fwctl and ops-agent."
assets = [
    ["target/release/fleetwatch-server", "usr/bin/", "755"],
    ["../../packaging/deb/server.toml.example", "etc/fleetwatch/server.toml", "640"],
    ["../../packaging/deb/fleetwatch-server.service", "lib/systemd/system/", "644"],
]
conf-files = ["/etc/fleetwatch/server.toml"]
maintainer-scripts = "../../packaging/deb/scripts-server"

[features]
test-support = []

[dependencies]
fw-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace"] }
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
rcgen = { version = "0.13", features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower = "0.5"

[dev-dependencies]
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
fw-proto = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
axum = { version = "0.8" }
