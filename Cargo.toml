[workspace]
resolver = "2"
members = ["crates/proto", "crates/server", "crates/agent"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
anyhow = "1"
thiserror = "1"
ed25519-dalek = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
