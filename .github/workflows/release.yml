# Tag-driven release. On `v*` tags this builds the Linux .debs (amd64+arm64,
# static musl), the macOS universal console app, publishes a GitHub Release,
# regenerates the signed APT repo on this repository's gh-pages branch,
# explicitly deploys it to GitHub Pages, and updates the cask.
#
# Required secret (run scripts/setup-apt-publishing.sh; see RELEASING.md):
#   GPG_PRIVATE_KEY      — release signing key; the apt-repo job FAILS without it
# Optional secrets (unsigned/ad-hoc app build when absent):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_API_ISSUER, APPLE_API_KEY_ID, APPLE_API_KEY
name: release

on:
  push:
    tags: ["v*"]

# APT metadata is cumulative, so two tag builds must not publish it at once.
concurrency:
  group: fleetwatch-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-deb:
    name: .deb (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check tag matches crate version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ok=0
          for f in crates/server/Cargo.toml crates/agent/Cargo.toml console/src-tauri/tauri.conf.json; do
            if grep -q "\"$ver\"" "$f"; then ok=$((ok+1)); else echo "WARNING: $f has no version $ver"; fi
          done
          [ "$ok" -eq 3 ] || { echo "tag $GITHUB_REF_NAME does not match all three version files — bump them (RELEASING.md)"; exit 1; }

      - name: Install cross tools
        run: cargo install cargo-zigbuild cargo-deb --locked

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build static binaries
        run: cargo zigbuild --release --target ${{ matrix.target }} -p fleetwatch-agent -p fleetwatch-server

      - name: Build .debs
        run: |
          cargo deb -p fleetwatch-agent --target ${{ matrix.target }} --no-build --no-strip
          cargo deb -p fleetwatch-server --target ${{ matrix.target }} --no-build --no-strip

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error

  macos-app:
    name: console .dmg (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Apple certificate and notarization credentials
        id: apple
        env:
          FW_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          FW_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          FW_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          FW_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          FW_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          FW_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          FW_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash ./scripts/prepare-apple-signing.sh

      - name: Build universal console app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Tauri expects the key ID under APPLE_API_KEY; the .p8 is a file.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          FW_APPLE_SIGNING_ENABLED: ${{ steps.apple.outputs.enabled }}
        run: |
          if [ "$FW_APPLE_SIGNING_ENABLED" != true ]; then
            unset APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
            export APPLE_SIGNING_IDENTITY='-'
          fi
          make app-universal

      - name: Verify signed and notarized application
        if: steps.apple.outputs.enabled == 'true'
        env:
          FW_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          app="console/src-tauri/target/universal-apple-darwin/release/bundle/macos/FleetWatch.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          team_id="$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          [ "$team_id" = "$FW_APPLE_TEAM_ID" ] || { echo "Unexpected signing team: $team_id" >&2; exit 1; }
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Remove temporary Apple signing material
        if: always()
        run: |
          signing_dir="$RUNNER_TEMP/fleetwatch-apple-signing"
          trap 'rm -rf "$signing_dir"' EXIT
          if [ -f "$signing_dir/signing.keychain-db" ]; then
            security delete-keychain "$signing_dir/signing.keychain-db"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: console/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  github-release:
    needs: [linux-deb, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/*.deb artifacts/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "FleetWatch $GITHUB_REF_NAME" --generate-notes

  apt-repo:
    needs: [linux-deb]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install repository tooling
        run: sudo apt-get update && sudo apt-get install -y apt-utils

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: deb-*
          merge-multiple: true

      - name: Fail early if signing key is missing
        env:
          FW_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [ -n "$FW_GPG_PRIVATE_KEY" ] || { echo "::error::GPG_PRIVATE_KEY secret is not set — the apt repo must be signed."; exit 1; }

      - name: Import GPG signing key
        env:
          FW_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$FW_GPG_PRIVATE_KEY" | gpg --batch --import
          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')"
          echo "Using signing key $keyid"
          echo "FW_GPG_KEY_ID=$keyid" >> "$GITHUB_ENV"

      - name: Fetch existing gh-pages repo
        run: |
          gh auth setup-git --hostname github.com
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          set +e
          git ls-remote --exit-code --heads "$url" gh-pages >/dev/null
          status=$?
          set -e
          case "$status" in
            0) git clone --depth 1 --branch gh-pages "$url" repo ;;
            2) mkdir repo && git -C repo init -b gh-pages && git -C repo remote add origin "$url" ;;
            *) echo "Cannot read gh-pages branch (git exit $status)" >&2; exit "$status" ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rebuild APT repo
        run: |
          ./scripts/build-apt-repo.sh repo artifacts/*.deb
          cp scripts/install-ubuntu.sh repo/install.sh
          cp packaging/apt/index.html repo/index.html
          cp docs/architecture.html repo/architecture.html
          cp docs/architecture.svg repo/architecture.svg
          touch repo/.nojekyll

      - name: Verify signed APT installation on Ubuntu
        run: |
          docker run --rm --platform linux/amd64 \
            --mount type=bind,src="$PWD/repo",dst=/apt-repo,readonly \
            --mount type=bind,src="$PWD/scripts/smoke-apt-install.sh",dst=/smoke.sh,readonly \
            ubuntu:24.04 sh /smoke.sh

      - name: Push gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd repo
          git config user.name "fleetwatch-release-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "apt repo: $GITHUB_REF_NAME" || echo "no changes to commit"
          git push origin gh-pages

      - name: Remove Git metadata from Pages files
        run: rm -rf repo/.git

      - name: Upload signed APT repository for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: repo

  apt-pages:
    needs: [apt-repo]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy signed APT repository
        id: deployment
        uses: actions/deploy-pages@v4

  homebrew-cask:
    needs: [github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: dmg
          path: dmg

      - name: Update Homebrew cask in this repository
        run: |
          ./scripts/update-homebrew-cask.sh "$GITHUB_REF_NAME" dmg/*.dmg
          git config user.name "fleetwatch-release-bot"
          git config user.email "actions@github.com"
          git add Casks/fleetwatch.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "homebrew: fleetwatch $GITHUB_REF_NAME"
          git pull --rebase origin main
          git push origin HEAD:main
