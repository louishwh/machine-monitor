<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>群哨 FleetWatch · v1 实现决策树</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1f2328; --ink2:#5b636e; --line:#e4e7ec;
    --accent:#2f6df6; --accent-soft:#eaf1ff; --rec:#0f9d6a; --rec-soft:#e8f7f0; --ok:#0f9d6a; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:860px;margin:0 auto;padding:28px 18px 80px;}
  h1{font-size:23px;margin:0 0 6px;}
  .sub{color:var(--ink2);font-size:14px;margin:0;}
  .progress-box{position:sticky;top:0;z-index:20;background:rgba(244,245,247,.92);backdrop-filter:saturate(180%) blur(8px);padding:12px 2px 10px;margin:14px 0 6px;}
  .bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;}
  .bar-fill{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .35s ease;}
  .bar-label{font-size:13px;color:var(--ink2);margin-top:6px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 16px;margin:14px 0;box-shadow:0 1px 2px rgba(16,24,40,.04);opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease;}
  .card.show{opacity:1;transform:none;}
  .card.done{border-color:#cfe0ff;}
  .q-index{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.5px;}
  .q-title{font-size:16px;font-weight:600;margin:4px 0 3px;}
  .q-hint{font-size:13px;color:var(--ink2);margin:0 0 14px;}
  .q-type{display:inline-block;font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:middle;}
  .opt{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;cursor:pointer;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:#c8d2e0;}
  .opt input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:0 0 auto;cursor:pointer;}
  .opt .o-text{font-size:14.5px;}
  .opt .o-desc{font-size:12.5px;color:var(--ink2);margin-top:1px;}
  .opt.checked{border-color:var(--accent);background:var(--accent-soft);}
  .opt.recommend{border-color:var(--rec);background:var(--rec-soft);}
  .opt.recommend.checked{border-color:var(--rec);background:#dcf3e8;}
  .badge{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:var(--rec);border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:middle;}
  .other-field{margin:6px 0 2px 28px;display:none;}
  .other-field.show{display:block;}
  .other-field input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;color:var(--ink);}
  .other-field input:focus{outline:none;border-color:var(--accent);}
  .notes-card textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;color:var(--ink);resize:vertical;}
  .notes-card textarea:focus{outline:none;border-color:var(--accent);}
  .result-card{display:none;}
  .result-card.show{display:block;}
  .result-card h2{font-size:17px;margin:0 0 4px;}
  .result-actions{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;}
  button{font-family:inherit;font-size:14px;font-weight:600;border:none;border-radius:9px;padding:10px 18px;cursor:pointer;transition:background .15s,color .15s,transform .05s;}
  button:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#1f5be0;}
  .btn-primary.copied{background:var(--ok);}
  .btn-ghost{background:#fff;color:var(--ink2);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:#c8d2e0;color:var(--ink);}
  pre.result{background:#0e1320;color:#d7e0ef;border-radius:10px;padding:16px;font-size:13px;line-height:1.55;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:0;}
  .foot{color:var(--ink2);font-size:12.5px;text-align:center;margin-top:26px;}
  .locked-note{color:var(--ink2);font-size:13px;text-align:center;margin:18px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>群哨 FleetWatch · v1 实现决策树</h1>
    <p class="sub">设计已定。这里把实现前还没钉死的工程选择逐题敲定，答完复制结果发回，直接进实现计划。</p>
  </header>

  <div class="progress-box">
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="bar-label"><span id="doneCount">0</span> / <span id="totalCount">0</span> 已完成</div>
  </div>

  <div id="questions"></div>

  <div class="locked-note" id="lockedNote">完成上方全部题目后，这里会出现结果汇总。</div>

  <div class="card notes-card show" id="notesCard" style="display:none;">
    <div class="q-index">补充</div>
    <div class="q-title">额外备注</div>
    <p class="q-hint">任何想补充的约束、已有基础设施、偏好，会一起写进结果。</p>
    <textarea id="notes" placeholder="例如：服务端跑在哪台云、已有的反代/证书、目标机器数量、安全合规要求……"></textarea>
  </div>

  <div class="card result-card" id="resultCard">
    <h2>实现计划输入文本</h2>
    <p class="q-hint" style="margin-bottom:0;">复制发回对话，据此生成 FleetWatch v1 实现计划。</p>
    <div class="result-actions">
      <button class="btn-primary" id="copyBtn">复制</button>
      <button class="btn-ghost" id="resetBtn">重置全部</button>
    </div>
    <pre class="result" id="resultText"></pre>
  </div>

  <div class="foot">单页本地工具 · 数据仅存于本浏览器 · 无外部依赖</div>
</div>

<script>
const QUESTIONS = [
  { id:"serverDeploy", type:"radio", title:"中心服务端部署形态", hint:"服务端怎么常驻运行。",
    options:[
      {v:"单二进制 + systemd 直跑", d:"最简，scp 上传二进制配 systemd unit 即可", rec:true},
      {v:"Docker 容器", d:"环境隔离、好迁移，但多一层"},
      {v:".deb 包安装", d:"和 agent 一致的打包方式"},
      {v:"其他", d:"", other:true},
    ]},
  { id:"tls", type:"radio", title:"服务端 TLS 方案", hint:"agent 反连与管理端控制面都走 TLS。",
    options:[
      {v:"反代(Caddy/Nginx)终止 TLS", d:"Caddy 自动证书最省事，服务端只听本地明文", rec:true},
      {v:"内置 rustls + Let's Encrypt", d:"服务端自管证书，少一个组件"},
      {v:"内置自签证书", d:"管理端/agent 内置固定指纹，简单但要分发 CA"},
      {v:"其他", d:"", other:true},
    ]},
  { id:"db", type:"radio", title:"服务端数据库", hint:"存机器、状态快照、审计。",
    options:[
      {v:"SQLite 起步", d:"单文件零运维，量级足够；以后再迁", rec:true},
      {v:"直接上 Postgres", d:"预期机器多/并发高时一步到位"},
      {v:"其他", d:"", other:true},
    ]},
  { id:"tokenExp", type:"radio", title:"机器身份令牌有效期", hint:"管理端签发的身份令牌。",
    options:[
      {v:"永久有效，靠吊销列表管理", d:"装机一次不用续；安全靠 revoke", rec:true},
      {v:"带过期，需定期续签", d:"更安全但要做续签流程"},
      {v:"其他", d:"", other:true},
    ]},
  { id:"statusMode", type:"radio", title:"状态上报模式", hint:"基础状态怎么到服务端。",
    options:[
      {v:"心跳带轻量摘要 + 按需拉详情", d:"列表常显概览，详情点开实时拉，省带宽", rec:true},
      {v:"仅按需拉取", d:"完全不主动上报，最省，但列表无概览"},
      {v:"周期全量上报", d:"实时性好但流量大"},
      {v:"其他", d:"", other:true},
    ]},
  { id:"history", type:"radio", title:"状态历史保留", hint:"快照存多少。",
    options:[
      {v:"仅最新快照", d:"v1 最简，看实时即可", rec:true},
      {v:"最近 50 条/机", d:"能看近期趋势"},
      {v:"最近 7 天", d:"更长回溯，库会变大"},
      {v:"其他", d:"", other:true},
    ]},
  { id:"shellTimeout", type:"radio", title:"shell 命令默认超时", hint:"受控任意命令的执行上限。",
    options:[
      {v:"30 秒", d:"够多数运维命令，防卡死", rec:true},
      {v:"60 秒", d:"留给稍重的命令"},
      {v:"不限(危险)", d:"不建议，易挂住 agent"},
      {v:"其他", d:"", other:true},
    ]},
  { id:"consoleNet", type:"radio", title:"管理端访问服务端的网络", hint:"控制面暴露面。",
    options:[
      {v:"公网 TLS + 强凭证", d:"管理端持主密钥签名鉴权，公网可达", rec:true},
      {v:"仅限内网 / VPN", d:"控制面不暴露公网，最安全"},
      {v:"SSH 隧道", d:"按需建隧道再连"},
      {v:"其他", d:"", other:true},
    ]},
  { id:"macInstall", type:"radio", title:"macOS agent 安装层级", hint:"launchd 形态。",
    options:[
      {v:"系统级 LaunchDaemon", d:"开机即跑、无需登录，贴合服务器/常驻", rec:true},
      {v:"用户级 LaunchAgent", d:"装在用户域，免 sudo 但需登录会话"},
      {v:"其他", d:"", other:true},
    ]},
  { id:"ports", type:"radio", title:"服务端端口布局", hint:"agent WS 与管理端控制面。",
    options:[
      {v:"单端口不同路径(/agent、/api)", d:"一个端口/证书搞定，反代友好", rec:true},
      {v:"分两个端口", d:"物理隔离 agent 面与操作面"},
      {v:"其他", d:"", other:true},
    ]},
  { id:"firstMilestone", type:"radio", title:"首批实现起点", hint:"先打通哪条链路出最小可用。",
    options:[
      {v:"先通 agent↔server 上线链路", d:"proto+server hub+agent 反连+心跳，先看到“在线”", rec:true},
      {v:"先做管理端签发与配对", d:"先把信任根/签发跑通"},
      {v:"先做状态采集器", d:"先把 sysinfo 采集做扎实"},
      {v:"其他", d:"", other:true},
    ]},
  { id:"futureNext", type:"checkbox", title:"v1 之后最想先加的能力", hint:"多选，用于排后续路线。",
    options:[
      {v:"告警/通知(阈值触发)", d:"状态异常主动推送", rec:true},
      {v:"指标时序图表", d:"历史趋势可视化"},
      {v:"apt 在线源", d:"做到 apt-get install fleetwatch-agent", rec:true},
      {v:"多操作者/权限", d:"团队协作与 RBAC"},
      {v:"agent 自动升级", d:"远程统一升级 agent"},
      {v:"Windows agent", d:"扩展到 Windows"},
      {v:"其他", d:"", other:true},
    ]},
];

const qWrap=document.getElementById("questions");
const barFill=document.getElementById("barFill");
const doneCountEl=document.getElementById("doneCount");
const totalCountEl=document.getElementById("totalCount");
const lockedNote=document.getElementById("lockedNote");
const notesCard=document.getElementById("notesCard");
const resultCard=document.getElementById("resultCard");
const resultText=document.getElementById("resultText");
const notesEl=document.getElementById("notes");
const TOTAL=QUESTIONS.length;
totalCountEl.textContent=TOTAL;

QUESTIONS.forEach((q,qi)=>{
  const card=document.createElement("div");
  card.className="card"; card.id="card-"+q.id;
  if(qi===0) card.classList.add("show");
  const typeLabel=q.type==="radio"?"单选":"多选";
  let html='<div class="q-index">第 '+(qi+1)+' / '+TOTAL+' 题</div>';
  html+='<div class="q-title">'+q.title+'<span class="q-type">'+typeLabel+'</span></div>';
  html+='<p class="q-hint">'+q.hint+'</p>';
  q.options.forEach((opt,oi)=>{
    const inputId=q.id+"-"+oi;
    const recCls=opt.rec?" recommend":"";
    const badge=opt.rec?'<span class="badge">推荐</span>':'';
    const desc=opt.d?'<div class="o-desc">'+opt.d+'</div>':'';
    html+='<label class="opt'+recCls+'" for="'+inputId+'">';
    html+='<input type="'+q.type+'" name="'+q.id+'" id="'+inputId+'" value="'+oi+'"'+(opt.other?' data-other="1"':'')+'>';
    html+='<span><span class="o-text">'+opt.v+badge+'</span>'+desc+'</span></label>';
    if(opt.other){html+='<div class="other-field" id="other-'+q.id+'"><input type="text" placeholder="请填写…" id="othertext-'+q.id+'"></div>';}
  });
  card.innerHTML=html; qWrap.appendChild(card);
});

QUESTIONS.forEach((q)=>{
  const inputs=document.querySelectorAll('input[name="'+q.id+'"]');
  inputs.forEach(inp=>{
    inp.addEventListener("change",()=>{
      document.querySelectorAll('#card-'+q.id+' .opt').forEach(o=>o.classList.remove("checked"));
      inputs.forEach(i=>{if(i.checked) i.closest(".opt").classList.add("checked");});
      const otherInput=document.querySelector('input[name="'+q.id+'"][data-other="1"]');
      const otherField=document.getElementById("other-"+q.id);
      if(otherField&&otherInput){ if(otherInput.checked) otherField.classList.add("show"); else otherField.classList.remove("show"); }
      update();
    });
  });
  const ot=document.getElementById("othertext-"+q.id);
  if(ot) ot.addEventListener("input",buildResult);
});
notesEl.addEventListener("input",buildResult);

function isDone(q){return document.querySelector('input[name="'+q.id+'"]:checked')!==null;}

function update(){
  let done=0;
  QUESTIONS.forEach((q)=>{const card=document.getElementById("card-"+q.id); if(isDone(q)){done++;card.classList.add("done");}else card.classList.remove("done");});
  QUESTIONS.forEach((q,qi)=>{const card=document.getElementById("card-"+q.id); if(qi===0){card.classList.add("show");return;} if(isDone(QUESTIONS[qi-1])) card.classList.add("show");});
  doneCountEl.textContent=done;
  barFill.style.width=Math.round(done/TOTAL*100)+"%";
  const allDone=done===TOTAL;
  if(allDone){lockedNote.style.display="none";notesCard.style.display="block";resultCard.classList.add("show");buildResult();}
  else{notesCard.style.display=done>=TOTAL-1?"block":"none";resultCard.classList.remove("show");}
}

function selectedFor(q){
  const checked=[...document.querySelectorAll('input[name="'+q.id+'"]:checked')];
  return checked.map(c=>{
    const oi=parseInt(c.value,10); const opt=q.options[oi];
    if(opt.other){const t=(document.getElementById("othertext-"+q.id).value||"").trim();return "其他："+(t||"（未填写）");}
    return opt.v;
  });
}

function buildResult(){
  let lines=["# 群哨 FleetWatch · v1 实现决策",""];
  QUESTIONS.forEach((q,qi)=>{
    const sels=selectedFor(q);
    lines.push("## "+(qi+1)+". "+q.title);
    if(sels.length===0) lines.push("- （未作答）"); else sels.forEach(s=>lines.push("- "+s));
    lines.push("");
  });
  const note=(notesEl.value||"").trim();
  lines.push("## 额外备注"); lines.push(note?note:"（无）"); lines.push("");
  lines.push("---"); lines.push("请据以上决策，把 FleetWatch v1 拆成可执行的实现计划。");
  resultText.textContent=lines.join("\n");
}

const copyBtn=document.getElementById("copyBtn");
copyBtn.addEventListener("click",()=>{
  navigator.clipboard.writeText(resultText.textContent).then(()=>{
    copyBtn.classList.add("copied");copyBtn.textContent="已复制 ✓";
    setTimeout(()=>{copyBtn.classList.remove("copied");copyBtn.textContent="复制";},1800);
  }).catch(()=>alert("自动复制失败，请手动选择文本复制。"));
});

document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("确定要清空所有选择和备注吗？此操作无法撤销。"))return;
  document.querySelectorAll('#questions input').forEach(i=>{i.checked=false;});
  document.querySelectorAll('#questions input[type="text"]').forEach(i=>i.value="");
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove("checked"));
  document.querySelectorAll('.other-field').forEach(o=>o.classList.remove("show"));
  notesEl.value="";
  QUESTIONS.forEach((q,qi)=>{const card=document.getElementById("card-"+q.id);card.classList.remove("done");if(qi!==0)card.classList.remove("show");});
  update();
});

update();
</script>
</body>
</html>
